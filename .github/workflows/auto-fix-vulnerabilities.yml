# .github/workflows/auto-fix-vulnerabilities.yml
name: Auto-fix High Severity Vulnerabilities

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9:00 AM UTC
  workflow_dispatch:      # Allow manual trigger from GitHub Actions UI

jobs:
  fix-vulnerabilities:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      security-events: read

    steps:
      - uses: actions/checkout@v4

      - name: Check for high severity alerts
        id: check-alerts
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          ALERTS=$(gh api /repos/${{ github.repository }}/dependabot/alerts \
            --jq '[.[] | select(.state=="open" and (.security_advisory.severity=="high" or .security_advisory.severity=="critical"))]')
          COUNT=$(echo $ALERTS | jq 'length')
          echo "Found $COUNT high/critical alerts"
          echo "alert_count=$COUNT" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        if: steps.check-alerts.outputs.alert_count > 0
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.check-alerts.outputs.alert_count > 0
        run: npm ci

      - name: Apply safe fixes
        if: steps.check-alerts.outputs.alert_count > 0
        id: audit-fix
        run: |
          # Apply only safe, non-breaking fixes
          npm audit fix || true

          # Capture remaining high/critical vulns that need --force
          REMAINING=$(npm audit --json | jq -r '
            .vulnerabilities | to_entries[] |
            select(.value.severity == "high" or .value.severity == "critical") |
            "- \(.key) (\(.value.severity)): upgrade required to \(.value.fixAvailable.version // "unknown version")"
          ' 2>/dev/null || echo "")

          HAS_REMAINING=false
          if [ -n "$REMAINING" ]; then
            HAS_REMAINING=true
          fi

          echo "has_remaining=$HAS_REMAINING" >> $GITHUB_OUTPUT

          # Use multiline output for remaining vulns
          echo "remaining_vulns<<EOF" >> $GITHUB_OUTPUT
          echo "$REMAINING" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check-alerts.outputs.alert_count > 0
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "fix: auto-patch high/critical security vulnerabilities"
          title: "🔒 Security: Auto-fix high/critical vulnerabilities"
          body: |
            ## 🔒 Automated Security Fix

            This PR was automatically generated by the weekly vulnerability scan.

            ---

            ### ✅ Safe fixes applied
            Non-breaking patches were applied via `npm audit fix`.

            ---

            ### ⚠️ Remaining vulnerabilities requiring manual action
            ${{ steps.audit-fix.outputs.has_remaining == 'true' && steps.audit-fix.outputs.remaining_vulns || 'None — all vulnerabilities were patched safely! 🎉' }}

            ${{ steps.audit-fix.outputs.has_remaining == 'true' && '> These require breaking version bumps. Run `npm audit fix --force` locally, test thoroughly, then push to this branch.' || '' }}

            ---

            ### 📋 Before merging
            - [ ] Review changed packages in the diff
            - [ ] Ensure CI tests pass
            - [ ] Manually fix any remaining vulnerabilities listed above
          branch: "security/auto-fix-vulnerabilities"
          labels: "security,automated"
          delete-branch: true
